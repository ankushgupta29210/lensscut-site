<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Lensscut</title>
    
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header id="header">
        <nav class="navbar">
            <a href="index.html" class="brand">Lensscut.</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html" class="active">Portfolio</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="btn-nav">Book Now</a></li>
            </ul>
            <div class="burger-menu" id="burger-menu">
                <span></span><span></span><span></span>
            </div>
        </nav>
    </header>

    <main class="page-container">
        <div class="portfolio-header animate-up delay-1">
            <h1>Selected Works</h1>
            <p>A curated collection of moments, emotions, and light.</p>
        </div>

        <div class="portfolio-grid fade-on-scroll">
            <div class="gallery-item">
                <img src="images/portfolio/img1.jpg" alt="Wedding Photography">
                <div class="gallery-overlay">
                    <span>01</span>
                    <h3>The Vows</h3>
                </div>
            </div>
            <div class="gallery-item">
                <img src="images/portfolio/img2.jpg" alt="Portrait Session">
                <div class="gallery-overlay">
                    <span>02</span>
                    <h3>Studio Portraits</h3>
                </div>
            </div>
            <div class="gallery-item">
                <img src="images/portfolio/img3.jpg" alt="Commercial Shoot">
                <div class="gallery-overlay">
                    <span>03</span>
                    <h3>Brand Editorials</h3>
                </div>
            </div>
            <div class="gallery-item">
                <img src="images/portfolio/img4.jpg" alt="Event Photography">
                <div class="gallery-overlay">
                    <span>04</span>
                    <h3>Live Events</h3>
                </div>
            </div>
            <div class="gallery-item">
                <img src="images/portfolio/img5.jpg" alt="Nature Photography">
                <div class="gallery-overlay">
                    <span>05</span>
                    <h3>Landscapes</h3>
                </div>
            </div>
            <div class="gallery-item">
                <img src="images/portfolio/img6.jpg" alt="Street Photography">
                <div class="gallery-overlay">
                    <span>06</span>
                    <h3>Urban Life</h3>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Lensscut Photography. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
